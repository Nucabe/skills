name: Skill proposal to pull request

# Turns a "Propose a skill" issue into a pull request that adds
# <prefix><name>/SKILL.md. Runs when an org member or collaborator opens the
# issue, or when a maintainer adds the make-pr label to someone else's.
#
# The issue text is untrusted. It is only handled inside the script below and
# never passed to a shell.

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  open-pr:
    if: >-
      contains(github.event.issue.labels.*.name, 'skill-proposal') &&
      (
        (github.event.action == 'opened' &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
        (github.event.action == 'labeled' && github.event.label.name == 'make-pr')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || "";

            // Issue forms render each field as "### <label>\n\n<value>".
            const field = (label) => {
              const re = new RegExp(`### ${label}\\s*\\n([\\s\\S]*?)(?=\\n### |$)`);
              const m = body.match(re);
              if (!m) return "";
              const v = m[1].trim();
              return v === "_No response_" ? "" : v;
            };

            const fail = async (msg) => {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number,
                body: `I could not open a pull request: ${msg}\n\nEdit the issue to fix it, then ask a maintainer to add the \`make-pr\` label.`,
              });
              core.setFailed(msg);
            };

            const prefixes = {
              "Design (design-)": "design-",
              "Marketing (marketing-)": "marketing-",
              "Client Partner (cp-)": "cp-",
              "General, any team (general-)": "general-",
            };
            const prefix = prefixes[field("Team")];
            if (!prefix) return fail("the Team field is empty or not one of the options.");

            let short = field("Command name").toLowerCase().replace(/^\/+/, "");
            if (short.startsWith(prefix)) short = short.slice(prefix.length);
            if (!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(short))
              return fail(`"${short}" is not a valid name. Use lowercase words joined by hyphens, such as eow-summary.`);
            const name = prefix + short;

            const title = field("Title").replace(/\s+/g, " ");
            const description = field("What it does and when to use it").replace(/\s+/g, " ");
            let instructions = field("Instructions");
            // Textareas with render: markdown arrive wrapped in a code fence.
            instructions = instructions.replace(/^```(?:markdown)?\n([\s\S]*?)\n```$/, "$1").trim();
            const sideEffects = /- \[[xX]\] This skill writes, sends or publishes/.test(body);
            const test = field("Test run");

            if (!title || !description || !instructions)
              return fail("Title, description and instructions are all required.");

            const lines = [
              "---",
              `name: ${name}`,
              `description: ${JSON.stringify(description)}`,
              ...(sideEffects ? ["disable-model-invocation: true"] : []),
              "---",
              "",
              `# ${title}`,
              "",
              instructions,
              "",
            ];
            const content = Buffer.from(lines.join("\n")).toString("base64");
            const path = `${name}/SKILL.md`;
            const branch = `skill/${name}-${issue.number}`;

            const { data: repo } = await github.rest.repos.get(context.repo);
            const base = repo.default_branch;
            const { data: ref } = await github.rest.git.getRef({ ...context.repo, ref: `heads/${base}` });

            try {
              await github.rest.git.createRef({ ...context.repo, ref: `refs/heads/${branch}`, sha: ref.object.sha });
            } catch (e) {
              if (e.status !== 422) throw e; // 422: branch already exists
            }

            let sha;
            try {
              const { data } = await github.rest.repos.getContent({ ...context.repo, path, ref: branch });
              sha = data.sha;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            try {
              const { data } = await github.rest.repos.getContent({ ...context.repo, path, ref: base });
              if (data && !sha) return fail(`a skill called ${name} already exists. To change it, edit ${path} on GitHub instead.`);
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            await github.rest.repos.createOrUpdateFileContents({
              ...context.repo, path, branch, content, sha,
              message: `Add ${name} skill\n\nProposed in #${issue.number} by @${issue.user.login}.`,
            });

            const existing = await github.rest.pulls.list({ ...context.repo, head: `${context.repo.owner}:${branch}`, state: "open" });
            let pr = existing.data[0];
            if (!pr) {
              ({ data: pr } = await github.rest.pulls.create({
                ...context.repo, head: branch, base,
                title: `Add /${name}`,
                body: [
                  `Proposed by @${issue.user.login} in #${issue.number}.`,
                  "",
                  `> ${description}`,
                  "",
                  "## Test run",
                  "",
                  test || "_None given._",
                  "",
                  `Closes #${issue.number}`,
                ].join("\n"),
              }));
            }

            await github.rest.issues.createComment({
              ...context.repo, issue_number: issue.number,
              body: `Pull request opened: ${pr.html_url}\n\nOnce a reviewer approves and merges it, anyone can install it and run \`/${name}\`. To change the wording before then, open the pull request, go to **Files changed**, and use the pencil icon on \`${path}\`.`,
            });
