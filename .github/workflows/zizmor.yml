name: zizmor

# Run only when a file that zizmor audits, or that changes how it runs,
# changes.
on:
  pull_request:
    paths:
      - .github/workflows/**
      - .github/dependabot.yml
      - .mise/tasks/lint/zizmor
      - mise.toml
      - mise.lock
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - .github/dependabot.yml
      - .mise/tasks/lint/zizmor
      - mise.toml
      - mise.lock
  workflow_dispatch:

permissions: {}

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      # Install only the tools this job uses.
      MISE_TASK_RUN_AUTO_INSTALL: "false"

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and zizmor
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
          # SHA-256 of the linux-x64 mise binary, from SHASUMS256.txt in the release.
          sha256: d24fe0bf7e613824ad99f7b8dac3f2b381a37b9f75f84dd250855217095a8de4
          install_args: aqua:zizmorcore/zizmor

      # The token enables the online audits, such as known-vulnerable-actions.
      - name: Audit workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run lint:zizmor
