name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    name: trufflehog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      # Install only the tools this job uses.
      MISE_TASK_RUN_AUTO_INSTALL: "false"

    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # mise.toml lists the tools, and mise.lock pins their checksums.
      - name: Install mise, trufflehog and jq
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
          # SHA-256 of the linux-x64 mise binary, from SHASUMS256.txt in the release.
          sha256: d24fe0bf7e613824ad99f7b8dac3f2b381a37b9f75f84dd250855217095a8de4
          install_args: aqua:trufflesecurity/trufflehog aqua:jqlang/jq

      # A pull request scans every commit it adds, not only the final diff.
      # With linear history each commit lands on main, so a secret that a
      # later commit removes is still in the history.
      # A push to main or a manual run scans the full history.
      - name: Scan for secrets
        env:
          # Empty outside a pull request, so the task scans the full history.
          SECRET_SCAN_BASE: ${{ github.event.pull_request.base.sha }}
          SECRET_SCAN_HEAD: ${{ github.event.pull_request.head.sha }}
        run: mise run secret-scan
