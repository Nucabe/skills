name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    # This file travels with the push. Without this guard the downstream
    # copy runs it too, against a repo that has none of the secrets.
    if: github.repository == 'yldio/skills'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

    steps:
      - name: Check out the full history of main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The deploy task needs no tools from mise.toml, so install none.
      # No cache, so a cache that another workflow wrote cannot reach the
      # job that holds the deploy key.
      - name: Install mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
          # SHA-256 of the linux-x64 mise binary, from SHASUMS256.txt in the release.
          sha256: d24fe0bf7e613824ad99f7b8dac3f2b381a37b9f75f84dd250855217095a8de4
          install: false
          cache: false

      - name: Deploy
        env:
          DEPLOYMENT_KEY: ${{ secrets.DEPLOYMENT_KEY }}
          # Format: host:owner/name - no scheme, no "git@" prefix, no ".git" suffix.
          DEPLOYMENT_TARGET: ${{ secrets.DEPLOYMENT_TARGET }}
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run deploy
