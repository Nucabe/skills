name: Propose a skill
description: Suggest a new skill. A pull request is opened for you and a team lead reviews it.
title: "Skill: "
labels: ["skill-proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Fill this in and submit. A bot turns it into a pull request with a `SKILL.md` file, and a reviewer from your team approves it before it goes live.

        This repository is public. Do not include client names, client data, personal data, passwords, tokens or keys.

  - type: dropdown
    id: team
    attributes:
      label: Team
      description: Decides the prefix of the command and who reviews it.
      options:
        - Design (design-)
        - Marketing (marketing-)
        - Client Partner (cp-)
        - General, any team (general-)
    validations:
      required: true

  - type: input
    id: name
    attributes:
      label: Command name
      description: "Lowercase words joined by hyphens, without the team prefix. `eow-summary` becomes `/design-eow-summary`."
      placeholder: eow-summary
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: Title
      description: A short Title Case label for what it does.
      placeholder: Write an End-of-Week Project Summary
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What it does and when to use it
      description: One or two sentences. The agent reads this to decide when to use the skill, so name the trigger.
      placeholder: Turns the project's Kanban board into a weekly stakeholder email. Use at the end of the week once the board is up to date.
    validations:
      required: true

  - type: textarea
    id: instructions
    attributes:
      label: Instructions
      description: The prompt or steps the agent follows. Paste it as it is; Markdown headings and lists are fine. The Notion page body of the skill works here.
      render: markdown
    validations:
      required: true

  - type: checkboxes
    id: side-effects
    attributes:
      label: Side effects
      options:
        - label: This skill writes, sends or publishes something (edits a Figma file, posts a message, sends an email). It will only run when someone types the command.

  - type: textarea
    id: test
    attributes:
      label: Test run
      description: The prompt you tried and what came out. Remove anything confidential.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: There are no client names, client data, personal data or credentials in this form.
          required: true
